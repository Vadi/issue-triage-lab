name: Feature request
description: Something we should add or change.
labels: ["needs-triage"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where did you see this?
      description: Pick the closest match. "Somewhere else / not sure" is a valid answer.
      options:
        - Getting started / onboarding
        - Timeline
        - Chat and messages
        - Riya's replies
        - Care circle
        - Profile and settings
        - Sign-in and phone number
        - Photos, videos and voice notes
        - Documents
        - Riya noticed / needs you
        - Phone calls and text messages
        - App releases (TestFlight, Play Store)
        - iOS app
        - Android app
        - Website / marketing site
        - Somewhere else / not sure
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      placeholder: Describe the outcome, not the implementation.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter?
      description: Who is it for, and what does it unblock?
    validations:
      required: false
